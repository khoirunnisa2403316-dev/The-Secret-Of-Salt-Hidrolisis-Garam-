<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <!-- Defs & Gradients -->
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#164E63" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.95" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Background Circles -->
  <circle cx="250" cy="200" r="160" fill="#0F766E" fill-opacity="0.06" filter="url(#softGlow)" />
  <circle cx="360" cy="140" r="90" fill="#5EEAD4" fill-opacity="0.12" filter="url(#softGlow)" />
  <circle cx="140" cy="280" r="110" fill="#164E63" fill-opacity="0.08" filter="url(#softGlow)" />

  <!-- Chemical Hexagon Lattice Bonds (Benzene Ring / Salt Crystals) -->
  <g stroke="#2DD4BF" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="4 4">
    <polygon points="120,80 155,100 155,140 120,160 85,140 85,100" />
    <polygon points="380,260 415,280 415,320 380,340 345,320 345,280" />
    <polygon points="390,70 420,87 420,122 390,140 360,122 360,87" />
  </g>

  <!-- Atomic Orbital Rings with Electron Particles -->
  <g transform="translate(130, 110)">
    <ellipse cx="0" cy="0" rx="45" ry="16" transform="rotate(-30)" stroke="#0F766E" stroke-width="2" stroke-opacity="0.6" fill="none" />
    <ellipse cx="0" cy="0" rx="45" ry="16" transform="rotate(30)" stroke="#5EEAD4" stroke-width="2" stroke-opacity="0.6" fill="none" />
    <circle cx="0" cy="0" r="8" fill="#0F766E" />
    <circle cx="36" cy="-18" r="4" fill="#5EEAD4" />
    <circle cx="-32" cy="20" r="4" fill="#FFD166" />
  </g>

  <!-- Big Central Erlenmeyer Flask -->
  <g transform="translate(250, 220)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="115" rx="90" ry="14" fill="#164E63" fill-opacity="0.1" />

    <!-- Flask Glass Body -->
    <path d="M-22,-110 L22,-110 L22,-65 L80,95 C86,110 74,115 50,115 L-50,115 C-74,115 -86,110 -80,95 L-22,-65 Z"
          fill="#FFFFFF" fill-opacity="0.35" stroke="#164E63" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Flask Rim -->
    <rect x="-26" y="-116" width="52" height="9" rx="4" fill="#FFFFFF" stroke="#164E63" stroke-width="4" />

    <!-- Liquid inside Flask -->
    <path d="M-55,50 C-20,40 20,60 55,50 L75,95 C78,105 70,110 48,110 L-48,110 C-70,110 -78,105 -75,95 Z"
          fill="url(#flaskLiquid)" />

    <!-- Meniscus Highlight Wave -->
    <path d="M-55,50 C-20,40 20,60 55,50" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Measurement Marks on Glass -->
    <line x1="-12" y1="-20" x2="-2" y2="-20" stroke="#164E63" stroke-width="2" opacity="0.6" />
    <line x1="-24" y1="10" x2="-8" y2="10" stroke="#164E63" stroke-width="2" opacity="0.6" />
    <line x1="-38" y1="40" x2="-18" y2="40" stroke="#164E63" stroke-width="2" opacity="0.6" />
    <line x1="-50" y1="70" x2="-26" y2="70" stroke="#164E63" stroke-width="2" opacity="0.6" />

    <!-- Glass Reflection Streak -->
    <path d="M-60,85 L-18,-50" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.5" />

    <!-- Bubbles rising in Flask -->
    <circle cx="-15" cy="85" r="5" fill="#FFFFFF" fill-opacity="0.8" />
    <circle cx="18" cy="72" r="7" fill="#FFFFFF" fill-opacity="0.7" />
    <circle cx="-5" cy="60" r="4" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="12" cy="30" r="6" fill="#5EEAD4" fill-opacity="0.85" />
    <circle cx="-10" cy="5" r="8" fill="#5EEAD4" fill-opacity="0.9" />
    <circle cx="6" cy="-25" r="5" fill="#2DD4BF" />
    <circle cx="-2" cy="-60" r="4.5" fill="#5EEAD4" />
    <circle cx="15" cy="-85" r="6" fill="#0F766E" fill-opacity="0.75" />
  </g>

  <!-- Floating Ion Badges -->
  <!-- H3O+ Ion Badge (Acidic Red Accent) -->
  <g transform="translate(125, 235)">
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#FF887A" stroke-width="3" filter="url(#softGlow)" />
    <text x="0" y="7" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#FF887A">H₃O⁺</text>
  </g>

  <!-- OH- Ion Badge (Basic Teal Accent) -->
  <g transform="translate(375, 175)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#0F766E" stroke-width="3" filter="url(#softGlow)" />
    <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#0F766E">OH⁻</text>
  </g>

  <!-- NH4+ Ion Badge (Purple Accent) -->
  <g transform="translate(365, 300)">
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#A995F5" stroke-width="2.5" />
    <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#7C3AED">NH₄⁺</text>
  </g>

  <!-- CH3COO- Ion Badge -->
  <g transform="translate(100, 335)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2.5" />
    <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#0F766E">AcO⁻</text>
  </g>

  <!-- Small Beaker on Right -->
  <g transform="translate(340, 240)">
    <rect x="0" y="0" width="34" height="48" rx="4" fill="#FFFFFF" fill-opacity="0.4" stroke="#164E63" stroke-width="3" />
    <rect x="-3" y="-2" width="40" height="5" rx="2" fill="#FFFFFF" stroke="#164E63" stroke-width="2" />
    <path d="M2,24 L32,24 L32,46 L2,46 Z" fill="#FFD166" fill-opacity="0.8" />
  </g>

  <!-- Test Tube on Left -->
  <g transform="translate(160, 290) rotate(-20)">
    <rect x="-6" y="-30" width="16" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.5" stroke="#164E63" stroke-width="3" />
    <rect x="-9" y="-33" width="22" height="6" rx="3" fill="#FFFFFF" stroke="#164E63" stroke-width="2" />
    <path d="M-4,0 L8,0 L8,12 C8,17 4,18 2,18 C0,18 -4,17 -4,12 Z" fill="#5EEAD4" />
  </g>

  <!-- Sparkles & Stars -->
  <path d="M200,60 L204,74 L218,78 L204,82 L200,96 L196,82 L182,78 L196,74 Z" fill="#FFD166" />
  <path d="M320,80 L322,90 L332,92 L322,94 L320,104 L318,94 L308,92 L318,90 Z" fill="#5EEAD4" />
  <circle cx="280" cy="70" r="3" fill="#0F766E" />
</svg>

